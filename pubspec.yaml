name: audiobook_app_flutter
description: A premium Android audiobook experience with background playback, media controls, and modern dark UI.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.4.0
  go_router: ^17.2.3
  freezed_annotation: ^2.2.0
  json_annotation: ^4.9.0
  dio: ^5.9.2
  cached_network_image: ^3.2.3
  flutter_animate: ^4.0.0
  google_fonts: ^5.0.0
  just_audio: ^0.9.37
  audio_service: ^0.18.18
  audio_session: ^0.1.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  flutter_local_notifications: ^13.0.0
  wakelock: ^0.6.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^2.2.0
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
